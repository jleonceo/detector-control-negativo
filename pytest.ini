[pytest]
# Este fichero existe para que el `conftest.py` de la raiz se cargue tambien cuando pytest se
# invoca desde una subcarpeta. Con un fichero de configuracion en la raiz, esa es la raiz que
# pytest toma, y desde ahi hacia abajo lee los conftest. Medido el 30/07/2026: con `conftest.py`
# solo, `cd ejemplo/bancos && python -m pytest -q` volvia a recoger las siete fixtures plantadas
# y a dar los mismos 9 fallos; con este fichero puesto, desde ahi no hay nada que ejecutar.
#
# El motivo entero de la exclusion esta escrito en `conftest.py`, en un solo sitio.

# Los nombres que pytest reclama. Son sus valores por defecto y van escritos a mano porque la
# colision de este repositorio nace aqui: el detector mide todo lo que se llame `test_*.py`,
# `run_tests*.py` o `*_test.py`, y de esos tres pytest recoge dos. `run_tests*.py` nunca fue
# suyo, y por eso el agregador del ejemplo nunca dio guerra.
python_files = test_*.py *_test.py
